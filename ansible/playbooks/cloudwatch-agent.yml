---
# ============================================================
# playbooks/cloudwatch-agent.yml - Configuration CloudWatch Agent
# ============================================================
# L'agent CloudWatch pousse des métriques système (CPU, mémoire,
# disque, réseau) vers CloudWatch depuis l'intérieur des instances.
#
# Sans cet agent, CloudWatch ne voit que les métriques hyperviseur
# (CPU uniquement). Avec l'agent, on obtient aussi :
# - Mémoire RAM utilisée (non disponible sans agent)
# - Espace disque restant
# - Logs applicatifs NGINX et FFmpeg
#
# Note : ce playbook nécessite un rôle IAM avec CloudWatchAgentServerPolicy
# sur les instances. Il est inclus ici pour la complétude de l'architecture.
# En l'absence de rôle IAM, l'agent démarrera mais ne pourra pas envoyer
# les métriques (AuthorizationError dans les logs).
#
# Exécution : ansible-playbook playbooks/cloudwatch-agent.yml
# ============================================================

- name: Configuration de l'agent CloudWatch
  hosts: role_frontend:role_streamer   # S'applique aux deux groupes
  become: true

  vars_files:
    - ../vars/generic.yaml

  tasks:

    # ----------------------------------------------------------
    # 1. Installation de l'agent CloudWatch
    # ----------------------------------------------------------
    # L'agent est installé par le user_data au démarrage de l'instance.
    # Cette tâche vérifie qu'il est bien présent et à jour.
    - name: Verification que l-agent CloudWatch est installe
      ansible.builtin.stat:
        path: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      register: cw_agent_binary

    - name: Telechargement et installation de l-agent si absent
      when: not cw_agent_binary.stat.exists
      block:
        - name: Telechargement du package
          ansible.builtin.get_url:
            url: https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
            dest: /tmp/amazon-cloudwatch-agent.deb
            mode: "0644"

        - name: Installation du package
          ansible.builtin.command: dpkg -i /tmp/amazon-cloudwatch-agent.deb
          args:
            creates: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl

    # ----------------------------------------------------------
    # 2. Déploiement de la configuration de l'agent
    # ----------------------------------------------------------
    # La configuration JSON dit à l'agent QUELLES métriques collecter
    # et vers QUEL log group les envoyer.
    - name: Creation du dossier de configuration
      ansible.builtin.file:
        path: /opt/aws/amazon-cloudwatch-agent/etc
        state: directory
        mode: "0755"

    - name: Deploiement de la configuration CloudWatch Agent
      ansible.builtin.copy:
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "agent": {
              "metrics_collection_interval": 60,
              "region": "{{ cloudwatch_region }}",
              "logfile": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log"
            },
            "metrics": {
              "namespace": "{{ cloudwatch_metrics_namespace }}",
              "metrics_collected": {
                "mem": {
                  "measurement": ["mem_used_percent"],
                  "metrics_collection_interval": 60
                },
                "disk": {
                  "measurement": ["used_percent"],
                  "metrics_collection_interval": 60,
                  "resources": ["/", "/mnt/efs/hls"]
                },
                "net": {
                  "measurement": ["bytes_sent", "bytes_recv"],
                  "metrics_collection_interval": 60
                }
              },
              "append_dimensions": {
                "InstanceId": "${aws:InstanceId}",
                "AutoScalingGroupName": "${aws:AutoScalingGroupName}"
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/nginx/access.log",
                      "log_group_name": "{{ cloudwatch_log_group }}",
                      "log_stream_name": "{instance_id}/nginx-access",
                      "timezone": "UTC"
                    },
                    {
                      "file_path": "/var/log/nginx/error.log",
                      "log_group_name": "{{ cloudwatch_log_group }}",
                      "log_stream_name": "{instance_id}/nginx-error",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
      notify: Redemarrer CloudWatch Agent

    # ----------------------------------------------------------
    # 3. Démarrage de l'agent
    # ----------------------------------------------------------
    - name: Demarrage de l-agent CloudWatch via son outil de controle
      ansible.builtin.command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config
        -m ec2
        -s
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
      changed_when: true

  handlers:
    - name: Redemarrer CloudWatch Agent
      ansible.builtin.command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a stop
      changed_when: true
