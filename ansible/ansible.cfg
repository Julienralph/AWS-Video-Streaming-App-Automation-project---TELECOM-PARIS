# ============================================================
# ansible.cfg - Configuration globale Ansible
# ============================================================
# Ce fichier est lu automatiquement par Ansible quand il est
# dans le répertoire courant. Il évite de répéter les options
# à chaque commande ansible-playbook.
# ============================================================

[defaults]

# Inventaire dynamique : découverte automatique des instances AWS par leurs tags.
# Plus robuste qu'un inventaire statique car les IPs changent après redémarrage.
inventory = inventory/aws_ec2.yaml

# Utilisateur créé automatiquement sur les AMIs Ubuntu 22.04 d'AWS.
remote_user = ubuntu

# Clé privée Ed25519 générée localement, dont la clé publique est dans AWS.
private_key_file = ~/.ssh/gin208-key

# Désactive la vérification de la signature du host SSH.
# Nécessaire pour les instances cloud dont on ne connaît pas la clé à l'avance.
# En production : utiliser known_hosts ou AWS EC2 Instance Connect.
host_key_checking = False

# Dossier où Ansible cherche les collections installées.
collections_path = ~/.ansible/collections

# Nombre de connexions parallèles. 5 est raisonnable pour un petit lab.
forks = 5

# Interpréteur Python : auto détecte la version disponible sur l'hôte distant.
interpreter_python = /usr/bin/python3.9

# Format de sortie plus lisible pour le debug.
stdout_callback = default
result_format = yaml

[ssh_connection]
# Accélère la connexion SSH en réutilisant les connexions existantes
# au lieu d'en ouvrir une nouvelle pour chaque tâche.
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
