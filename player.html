<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIN208 - Live Streaming</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #ccc; }
    h1 { margin-bottom: 1rem; font-size: 1.2rem; letter-spacing: 0.1em; color: #aaa; }
    video { width: 100%; max-width: 1280px; border: 1px solid #333; }
    #status { margin-top: 0.8rem; font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>
  <h1>GIN208 · Live Stream (HLS)</h1>
  <video id="video" controls autoplay muted playsinline></video>
  <p id="status">Chargement du flux...</p>
  <script>
    var video = document.getElementById('video');
    var status = document.getElementById('status');
    var src = '/hls/stream.m3u8';

    if (Hls.isSupported()) {
      var hls = new Hls({ lowLatencyMode: true });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        status.textContent = 'Flux connecté.';
        video.play();
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        status.textContent = 'Erreur : ' + data.type + ' - ' + data.details;
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      status.textContent = 'Flux connecté (Safari natif HLS).';
    } else {
      status.textContent = 'Navigateur non supporté.';
    }
  </script>
</body>
</html>
